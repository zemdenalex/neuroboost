# Dev environment — separate containers, ports, volumes from production
# Deployed from 'develop' branch to dev.neuroboost.website

services:
  db:
    image: postgres:16-alpine
    container_name: neuroboost-dev-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neuroboost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-neuroboost}
      TZ: UTC
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./api-go
      dockerfile: Dockerfile
    container_name: neuroboost-dev-api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-neuroboost}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-neuroboost}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: development
      API_PORT: 8080
      LOG_LEVEL: debug
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_NOTIFICATION_BOT_TOKEN: ${TELEGRAM_NOTIFICATION_BOT_TOKEN}
      # Guards /api/svc/*. Unset closes those endpoints with 503.
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      FRONTEND_URL: ${FRONTEND_URL:-https://dev.neuroboost.website}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/srv/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${FRONTEND_URL:-https://dev.neuroboost.website}/api
    container_name: neuroboost-dev-web
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "127.0.0.1:5174:80"
    restart: unless-stopped

  bot:
    build:
      context: ./bot
    container_name: neuroboost-dev-bot
    # Not started by `up -d`. The staging bot runs off-site (nl-2, Netherlands)
    # because Telegram is unreachable from this host; a second container here
    # would long-poll getUpdates on the SAME token, and Telegram hands each
    # update to exactly one consumer — delivery would flap rather than fail,
    # which is harder to notice. Stopping it by hand is not durable: deploy-dev
    # runs `down --remove-orphans && up -d` on every push to develop and would
    # bring it straight back. Run it here only if the bot ever moves back:
    #   docker compose -f docker-compose.dev.yml --profile local-bot up -d bot
    profiles: [local-bot]
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - API_BASE=http://api:8080
      - BOT_PORT=3002
      - TIMEZONE=Europe/Moscow
      # Same value as the API's SERVICE_TOKEN. Unset disables the notifier.
      - SERVICE_TOKEN=${SERVICE_TOKEN}
      - TELEGRAM_PROXY=${TELEGRAM_PROXY}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3012:3002"
    restart: unless-stopped

volumes:
  dev-db-data:
    name: neuroboost_dev_db_data

networks:
  default:
    name: neuroboost_dev_network
