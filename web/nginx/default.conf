server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Health endpoint for Docker healthcheck
  location = /healthz { return 200; }

  # Static files
  location /assets/ {
    try_files $uri =404;
    access_log off;
    expires 7d;
  }

  # SPA fallback
  location / {
    try_files $uri /index.html;
  }
}
