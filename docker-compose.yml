services:
  db:
    image: postgres:16-alpine
    container_name: neuroboost-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neuroboost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-neuroboost}
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./api-go
      dockerfile: Dockerfile
    container_name: neuroboost-api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-neuroboost}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-neuroboost}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: 8080
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_NOTIFICATION_BOT_TOKEN: ${TELEGRAM_NOTIFICATION_BOT_TOKEN}
      # Guards /api/svc/*. Unset closes those endpoints with 503.
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      FRONTEND_URL: ${FRONTEND_URL:-https://neuroboost.website}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/srv/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${FRONTEND_URL:-https://neuroboost.website}/api
    container_name: neuroboost-web
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "127.0.0.1:5173:80"
    restart: unless-stopped

  bot:
    build:
      context: ./bot
    container_name: neuroboost-bot
    # Not started by `up -d` — same reason as the staging bot. Telegram is
    # unreachable from this host (only intermittently reachable, which is
    # worse), so the bot runs off-site on nl-2. A second container here would
    # long-poll getUpdates on the SAME token and Telegram would hand each update
    # to one of them at random.
    #
    # A profile rather than `docker compose stop`, because the deploy job runs
    # `down --remove-orphans && up -d` on every push to main and would bring a
    # stopped service straight back.
    #
    # ⚠ A profile hides the service from EVERY compose subcommand, `down`
    # included, so an already-running container is not removed by adding this —
    # take it out by hand with `docker rm -f neuroboost-bot`.
    profiles: [local-bot]
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - API_BASE=http://api:8080
      - BOT_PORT=3002
      - TIMEZONE=Europe/Moscow
      # Same value as the API's SERVICE_TOKEN. Unset disables the notifier.
      - SERVICE_TOKEN=${SERVICE_TOKEN}
      - TELEGRAM_PROXY=${TELEGRAM_PROXY}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3002:3002"
    restart: unless-stopped

volumes:
  db-data:
    name: neuroboost_db_data

networks:
  default:
    name: neuroboost_network
