services:
  db:
    image: postgres:16-alpine
    container_name: neuroboost-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neuroboost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-neuroboost}
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./api-go
      dockerfile: Dockerfile
    container_name: neuroboost-api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-neuroboost}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-neuroboost}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: 8080
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_NOTIFICATION_BOT_TOKEN: ${TELEGRAM_NOTIFICATION_BOT_TOKEN}
      FRONTEND_URL: ${FRONTEND_URL:-https://neuroboost.website}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/srv/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${FRONTEND_URL:-https://neuroboost.website}/api
    container_name: neuroboost-web
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "127.0.0.1:5173:80"
    restart: unless-stopped

volumes:
  db-data:
    name: neuroboost_db_data

networks:
  default:
    name: neuroboost_network
