version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: neuroboost-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neuroboost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-neuroboost}
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432" # localhost only
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./neuroboost-api-go/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neuroboost} -d ${POSTGRES_DB:-neuroboost}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./neuroboost-api-go
      dockerfile: Dockerfile
    container_name: neuroboost-api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-neuroboost}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-neuroboost}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: 8080
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_NOTIFICATION_BOT_TOKEN: ${TELEGRAM_NOTIFICATION_BOT_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "127.0.0.1:8080:8080" # expose to host for Nginx
    restart: unless-stopped
  web:
    build:
      context: ./neuroboost-web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${FRONTEND_URL}/api
    container_name: neuroboost-web
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "127.0.0.1:5173:80"
    restart: unless-stopped


volumes:
  db-data:
    name: neuroboost_db_data

networks:
  default:
    name: neuroboost_network