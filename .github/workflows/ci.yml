name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: '1.22'
  NODE_VERSION: '22'

jobs:
  backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: neuroboost_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install golang-migrate
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.0/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/local/bin/migrate

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U test && break
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 1
          done

      - name: Run migrations
        run: |
          cd api-go
          migrate -path migrations -database "postgres://test:test@localhost:5432/neuroboost_test?sslmode=disable" up
        
      - name: Build API
        run: |
          cd api-go
          go build -o bin/api ./cmd/api

      - name: Build healthcheck
        run: |
          cd api-go
          go build -o bin/healthcheck ./cmd/healthcheck

      - name: Run tests
        run: |
          cd api-go
          go test -v ./...
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/neuroboost_test?sslmode=disable
          JWT_SECRET: test-secret-minimum-32-characters-long

  frontend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm i -g pnpm@9

      - name: Install dependencies
        run: |
          cd web
          pnpm install

      - name: Type check
        run: |
          cd web
          pnpm typecheck || true  # Don't fail on type errors for now

      - name: Build
        run: |
          cd web
          pnpm build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
      - uses: actions/checkout@v4

      - name: Create test .env file
        run: |
          cat > .env << EOF
          POSTGRES_USER=neuroboost
          POSTGRES_PASSWORD=ci-test-password-12345
          POSTGRES_DB=neuroboost
          JWT_SECRET=ci-test-jwt-secret-minimum-32-chars
          TELEGRAM_BOT_TOKEN=fake:token
          TELEGRAM_NOTIFICATION_BOT_TOKEN=fake:token
          FRONTEND_URL=http://localhost
          NODE_ENV=test
          EOF

      - name: Build Docker images
        run: |
          docker compose build

      - name: Start database
        run: |
          docker compose up -d db
          echo "Waiting for database to be healthy..."
          for i in {1..60}; do
            if docker compose exec -T db pg_isready -U neuroboost -d neuroboost 2>/dev/null; then
              echo "Database is ready!"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/60)"
            sleep 2
          done

      - name: Start API
        run: |
          docker compose up -d api
          echo "Waiting for API to be healthy..."
          sleep 10
          for i in {1..30}; do
            if curl -sf http://localhost:8080/api/health > /dev/null 2>&1; then
              echo "API is healthy!"
              break
            fi
            echo "Waiting for API... ($i/30)"
            sleep 2
          done

      - name: Test API health
        run: |
          curl -f http://localhost:8080/api/health || (docker compose logs api && exit 1)

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== DB Logs ==="
          docker compose logs db
          echo "=== API Logs ==="
          docker compose logs api

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v