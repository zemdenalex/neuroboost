name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: '1.22'
  NODE_VERSION: '22'

jobs:
  backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: neuroboost_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install golang-migrate
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.0/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/local/bin/migrate

      - name: Run migrations
        run: |
          cd api-go
          migrate -path migrations -database "postgres://test:test@localhost:5432/neuroboost_test?sslmode=disable" up
        
      - name: Build API
        run: |
          cd api-go
          go build -o bin/api ./cmd/api

      - name: Build healthcheck
        run: |
          cd api-go
          go build -o bin/healthcheck ./cmd/healthcheck

      - name: Run tests
        run: |
          cd api-go
          go test -v ./...
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/neuroboost_test?sslmode=disable
          JWT_SECRET: test-secret

  frontend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm i -g pnpm@9

      - name: Install dependencies
        run: |
          cd web
          pnpm install

      - name: Type check
        run: |
          cd web
          pnpm typecheck || true  # Don't fail on type errors for now

      - name: Build
        run: |
          cd web
          pnpm build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker compose build --no-cache

      - name: Test Docker health
        run: |
          docker compose up -d db
          sleep 10
          docker compose up -d api
          sleep 15
          curl -f http://localhost:8080/api/health || exit 1
          docker compose down
