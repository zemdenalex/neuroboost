name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: '1.22'
  NODE_VERSION: '22'

jobs:
  backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: neuroboost_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api-go/go.sum

      - name: Install golang-migrate
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.0/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/local/bin/migrate

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U test && break
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 1
          done

      - name: Run migrations
        run: |
          cd api-go
          migrate -path migrations -database "postgres://test:test@localhost:5432/neuroboost_test?sslmode=disable" up
        
      - name: Build API
        run: |
          cd api-go
          go build -o bin/api ./cmd/api

      - name: Build healthcheck
        run: |
          cd api-go
          go build -o bin/healthcheck ./cmd/healthcheck

      - name: Run tests
        run: |
          cd api-go
          go test -v ./...
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/neuroboost_test?sslmode=disable
          JWT_SECRET: test-secret-minimum-32-characters-long

  frontend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm i -g pnpm@9

      - name: Install dependencies
        run: |
          cd web
          pnpm install

      - name: Type check
        run: |
          cd web
          pnpm typecheck

      - name: Build
        run: |
          cd web
          pnpm build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
      - uses: actions/checkout@v5

      - name: Create test .env file
        run: |
          cat > .env << EOF
          POSTGRES_USER=neuroboost
          POSTGRES_PASSWORD=ci-test-password-12345
          POSTGRES_DB=neuroboost
          JWT_SECRET=ci-test-jwt-secret-minimum-32-chars
          TELEGRAM_BOT_TOKEN=fake:token
          TELEGRAM_NOTIFICATION_BOT_TOKEN=fake:token
          FRONTEND_URL=http://localhost
          NODE_ENV=test
          EOF

      - name: Build Docker images
        run: |
          docker compose build

      - name: Start database
        run: |
          docker compose up -d db
          echo "Waiting for database to be healthy..."
          for i in {1..60}; do
            if docker compose exec -T db pg_isready -U neuroboost -d neuroboost 2>/dev/null; then
              echo "Database is ready!"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/60)"
            sleep 2
          done

      - name: Start API
        run: |
          docker compose up -d api
          echo "Waiting for API to be healthy..."
          sleep 10
          for i in {1..30}; do
            if curl -sf http://localhost:8080/api/health > /dev/null 2>&1; then
              echo "API is healthy!"
              break
            fi
            echo "Waiting for API... ($i/30)"
            sleep 2
          done

      - name: Test API health
        run: |
          curl -f http://localhost:8080/api/health || (docker compose logs api && exit 1)

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== DB Logs ==="
          docker compose logs db
          echo "=== API Logs ==="
          docker compose logs api

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v

  deploy:
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            # Retry git over transient DNS/network blips on the host (a failed
            # `git pull` here has aborted a deploy with "Could not resolve host").
            retry() { for i in 1 2 3; do "$@" && return 0; echo "attempt $i failed, retrying in 5s..."; sleep 5; done; return 1; }
            cd /opt/neuroboost
            # Backup before deploy
            ./scripts/backup.sh || echo "Backup failed, continuing deploy..."
            # Pull and rebuild
            retry git pull origin main
            docker compose build --pull
            docker compose down
            docker compose up -d
            # Wait for health
            sleep 15
            curl -fsS http://127.0.0.1:8080/api/health || exit 1
            echo "Deploy successful"

      - name: Notify Telegram (success)
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d parse_mode=HTML \
            -d text="✅ <b>NeuroBoost deployed</b>%0ACommit: <code>${{ github.sha }}</code>%0ABranch: main%0ABy: ${{ github.actor }}"

      - name: Notify Telegram (failure)
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d parse_mode=HTML \
            -d text="❌ <b>NeuroBoost deploy FAILED</b>%0ACommit: <code>${{ github.sha }}</code>%0ABranch: main%0ABy: ${{ github.actor }}%0A<a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>View logs</a>"

  deploy-dev:
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - name: Deploy to dev
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            # Retry git over transient DNS/network blips on the host (a failed
            # `git fetch` here has aborted a deploy with "Could not resolve host").
            retry() { for i in 1 2 3; do "$@" && return 0; echo "attempt $i failed, retrying in 5s..."; sleep 5; done; return 1; }
            cd /root/neuroboost-dev
            retry git fetch origin develop
            git checkout develop
            retry git pull origin develop

            # Sync production DB → dev DB (both containers must be running)
            echo "Syncing production database to dev..."
            docker compose -f /root/neuroboost/docker-compose.yml exec -T db \
              pg_dump -U neuroboost -c --if-exists neuroboost 2>/dev/null | \
              docker compose -f /root/neuroboost-dev/docker-compose.dev.yml exec -T db \
              psql -U neuroboost -d neuroboost 2>/dev/null || echo "DB sync failed, continuing with existing data"

            # Build and restart
            docker compose -f docker-compose.dev.yml build --pull
            docker compose -f docker-compose.dev.yml down --remove-orphans
            docker compose -f docker-compose.dev.yml up -d

            # Wait for health
            sleep 15
            curl -fsS http://127.0.0.1:8081/api/health || exit 1
            echo "Dev deploy successful"

      - name: Notify Telegram (success)
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d parse_mode=HTML \
            -d text="🔧 <b>NeuroBoost DEV deployed</b>%0ACommit: <code>${{ github.sha }}</code>%0ABranch: develop%0ABy: ${{ github.actor }}%0AURL: https://dev.neuroboost.website"

      - name: Notify Telegram (failure)
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d parse_mode=HTML \
            -d text="❌ <b>NeuroBoost DEV deploy FAILED</b>%0ACommit: <code>${{ github.sha }}</code>%0ABranch: develop%0A<a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>View logs</a>"